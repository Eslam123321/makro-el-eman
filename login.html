<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مصنع الإيمان للمكرونة | تسجيل الدخول الإداري</title>
  
  <meta name="theme-color" content="#059669">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="مصنع الإيمان">
  <link rel="apple-touch-icon" href="image/logo.png">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="image/logo.png">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap">

  <style>
    body {
      background: radial-gradient(circle at 10% 20%, #ecfdf5 0%, #f8fafc 50%, #ffffff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: rgba(5, 150, 105, 0.08);
      border-radius: 50%;
      top: -100px;
      right: -100px;
      filter: blur(60px);
    }

    body::after {
      content: '';
      position: absolute;
      width: 350px;
      height: 350px;
      background: rgba(37, 99, 235, 0.06);
      border-radius: 50%;
      bottom: -80px;
      left: -80px;
      filter: blur(60px);
    }

    .login-card-box {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-radius: var(--radius-xl);
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 20px 40px -10px rgba(15, 23, 42, 0.12);
      padding: 2.75rem 2.25rem;
      position: relative;
      z-index: 10;
    }

    .login-brand-logo-img {
      width: 88px;
      height: 88px;
      object-fit: contain;
      margin: 0 auto 1.25rem auto;
      display: block;
      filter: drop-shadow(0 6px 12px rgba(5, 150, 105, 0.25));
    }

    .login-footer-credits {
      margin-top: 2.25rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      padding-top: 1.25rem;
      font-weight: 500;
    }

    .login-footer-credits strong {
      color: var(--text-primary);
    }
  </style>
</head>
<body>

  <div class="login-card-box animate-fade-in">
    <div class="text-center mb-6">
      <img src="image/logo.png" alt="شعار مصنع الإيمان للمكرونة" class="login-brand-logo-img">
      <h2 style="font-size: 1.65rem; color: #0f172a; font-weight: 800;">مصنع الإيمان للمكرونة</h2>
      <p class="text-xs text-muted mt-1">نظام ERP الإداري المتكامل لإدارة الإنتاج والمبيعات والمخازن</p>
    </div>

    <form onsubmit="handleLogin(event)" id="login-form">
      <div class="form-group mb-4">
        <label><i class="fa-regular fa-envelope ml-1 text-primary-color"></i> البريد الإلكتروني أو اسم المستخدم (Email / Username)</label>
        <input type="text" id="username" class="form-control" placeholder="ادخل البريد الإلكتروني (مثال: admin@eleman.com)" autocomplete="email" required>
      </div>

      <div class="form-group mb-6">
        <label><i class="fa-solid fa-lock ml-1 text-primary-color"></i> كلمة المرور السرية</label>
        <div style="position: relative;">
          <input type="password" id="password" class="form-control" placeholder="ادخل كلمة المرور السرية" autocomplete="current-password" required style="padding-left: 40px;">
          <button type="button" onclick="togglePasswordVisibility()" style="position: absolute; left: 12px; top: 11px; background: none; border: none; color: var(--text-muted); cursor: pointer;" title="إظهار / إخفاء كلمة المرور">
            <i class="fa-regular fa-eye" id="toggle-pwd-icon"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="login-submit-btn" class="btn btn-primary w-full" style="padding: 0.875rem; font-size: 1rem; font-weight: bold;">
        <i class="fa-solid fa-right-to-bracket ml-2"></i> تسجيل الدخول للنظام 🚀
      </button>
    </form>

    <div class="login-footer-credits">
      <p>حقوق البرمجة والتطوير محفوظة © 2026 | بواسطة شركة <a href="https://speed-up.tech/" target="_blank" rel="noopener noreferrer" style="color: #059669; font-weight: 800; text-decoration: underline;">Speed Up 🚀</a></p>
    </div>
  </div>

  <!-- Firebase Cloud SDK & Sync Engine -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="js/firebase-sync.js"></script>
  <script src="js/logo.js"></script>
  <script src="js/app.js"></script>
  <script>
    function togglePasswordVisibility() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('toggle-pwd-icon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        pwd.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const uInput = document.getElementById('username').value.trim();
      const pInput = document.getElementById('password').value.trim();
      const btn = document.getElementById('login-submit-btn');

      if (!uInput || !pInput) {
        App.showToast('رجاء إدخال البريد الإلكتروني وكلمة المرور', 'warning');
        return;
      }

      // Convert username without @ to standard email format if needed
      let email = uInput;
      if (!email.includes('@')) {
        email = `${email.toLowerCase()}@eleman.com`;
      }

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin ml-2"></i> جاري التحقق من السحابة...`;

      try {
        if (typeof FirebaseSync !== 'undefined' && FirebaseSync.auth) {
          // 1. Authenticate with Firebase Auth directly
          const fbUser = await FirebaseSync.loginWithFirebase(email, pInput);
          const currentUser = App.getCurrentUser();
          const displayName = (currentUser && currentUser.name) ? currentUser.name : (fbUser.displayName || 'المدير العام');

          App.showToast(`تم تسجيل الدخول بنجاح! مرحباً بك يا ${displayName} ✨`, 'success');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 400);
        } else {
          // Offline fallback
          App.db = StorageManager.getDB();
          const users = App.db.users || [];
          const found = users.find(u => 
            (u.email && u.email.toLowerCase() === email.toLowerCase()) ||
            (u.username && u.username.toLowerCase() === uInput.toLowerCase())
          );

          if (!found || found.password !== pInput) {
            throw new Error('اسم المستخدم أو كلمة المرور غير صحيحة');
          }
          if (found.status === 'معطل') {
            throw new Error('عفواً، هذا الحساب معطل حالياً من قبل إدارة المصنع');
          }

          App.setCurrentUser(found);
          App.showToast(`تم تسجيل الدخول محلياً! مرحباً بك يا ${found.name}`, 'success');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 400);
        }
      } catch (err) {
        console.error('Login error:', err);
        let errorMsg = 'تعذر تسجيل الدخول';
        const code = err.code || '';

        if (code === 'auth/wrong-password' || code === 'auth/invalid-credential' || code === 'auth/invalid-login-credentials') {
          errorMsg = 'كلمة المرور غير صحيحة أو البريد الإلكتروني غير متطابق!';
        } else if (code === 'auth/user-not-found') {
          errorMsg = 'عفواً، لا يوجد حساب مسجل بهذا البريد الإلكتروني في السحابة.';
        } else if (code === 'auth/invalid-email') {
          errorMsg = 'صيغة البريد الإلكتروني غير صحيحة.';
        } else if (code === 'auth/user-disabled') {
          errorMsg = 'عفواً، تم تعطيل هذا الحساب من قبل إدارة المصنع.';
        } else if (code === 'auth/too-many-requests') {
          errorMsg = 'تم حظر المحاولات مؤقتاً بسبب كثرة المحاولات الخاطئة. يرجى الانتظار دقيقة والمحاولة مجدداً.';
        } else if (err.message) {
          errorMsg = err.message;
        }

        App.showToast(errorMsg, 'danger');
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-right-to-bracket ml-2"></i> تسجيل الدخول للنظام 🚀`;
      }
    }
  </script>
</body>
</html>
